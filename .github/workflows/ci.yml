name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: tools 타입 검사 (tools/setup/voice.ts는 클라우드 서버가 켜질 때 돈다)
        run: npx tsc -p tools/tsconfig.json --noEmit
      - run: npm test
      - name: 화면 묶음 만들기 (빌드 오류 확인)
        run: npx vite build -c apps/studio/vite.config.ts --logLevel error
