name: Static site CI

on:
  push:
    branches:
      - 'agent/food-strategy-lab'
      - 'chore/**'
      - 'fix/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify site entry point
        run: test -f index.html && test -f styles.css && grep -q 'app.js' index.html
